<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Трекер 77 дней · Зарик</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f13;
    --card:     #1a1a24;
    --border:   #2a2a3a;
    --accent:   #7c6af5;
    --accent2:  #5b4fcf;
    --done:     #4caf82;
    --text:     #e8e8f0;
    --muted:    #6b6b8a;
    --radius:   12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1e1a3a 0%, #12102a 100%);
    padding: 28px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .header .sloth { font-size: 48px; margin-bottom: 8px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* Stats row */
  .stats {
    display: flex;
    gap: 10px;
    padding: 16px 16px 0;
  }
  .stat-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
  }
  .stat-val {
    font-size: 26px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .stat-val.green { color: var(--done); }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Progress bar */
  .progress-wrap {
    margin: 16px 16px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* Grid */
  .grid-wrap {
    margin: 16px 16px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .grid-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 5px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--muted);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .day-cell:active { transform: scale(0.9); }
  .day-cell.done {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
    font-size: 10px;
  }
  .day-cell.today {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(124,106,245,0.3);
  }
  .day-cell.future { opacity: 0.35; cursor: default; }

  /* Tasks */
  .tasks-wrap {
    margin: 16px 16px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .tasks-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .task-row:last-child { border-bottom: none; }
  .task-check {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }
  .task-row.done .task-check {
    background: var(--done);
    border-color: var(--done);
  }
  .task-text { font-size: 14px; }
  .task-row.done .task-text { color: var(--muted); text-decoration: line-through; }

  /* CTA banner */
  .cta {
    margin: 20px 16px 0;
    background: linear-gradient(135deg, #2a2050, #1e1a40);
    border: 1px solid #3d3580;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }
  .cta h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .cta p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
  .cta-btn {
    display: block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.2px;
    transition: opacity 0.15s;
  }
  .cta-btn:active { opacity: 0.85; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #28253f;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="sloth">🦥</div>
  <h1>Трекер 77 дней</h1>
  <p>Твой личный дашборд прогресса</p>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-val" id="stat-done">0</div>
    <div class="stat-label">Дней</div>
  </div>
  <div class="stat-card">
    <div class="stat-val green" id="stat-streak">0</div>
    <div class="stat-label">🔥 Серия</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" id="stat-pct">0%</div>
    <div class="stat-label">Прогресс</div>
  </div>
</div>

<!-- Progress bar -->
<div class="progress-wrap">
  <div class="progress-row">
    <span>День 1</span>
    <span id="prog-label">0 / 77</span>
    <span>День 77</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="prog-fill" style="width:0%"></div>
  </div>
</div>

<!-- 77-day grid -->
<div class="grid-wrap">
  <div class="grid-title">77 дней · нажми чтобы отметить</div>
  <div class="grid" id="grid"></div>
</div>

<!-- Today tasks -->
<div class="tasks-wrap">
  <div class="tasks-title">5 задач дня</div>
  <div id="tasks-list"></div>
</div>

<!-- CTA -->
<div class="cta">
  <h3>Хочешь начать по-настоящему?</h3>
  <p>Бот-наставник сам будет присылать задачи, считать серии и следить за прогрессом — каждый день 77 дней.</p>
  <a class="cta-btn" href="https://t.me/Shagov77_bot">🚀 Начать в Telegram</a>
</div>

<div class="toast" id="toast"></div>

<script>
const TOTAL = 77;
const TASKS = [
  { icon: "💪", label: "Тренировка" },
  { icon: "💧", label: "Вода · 2 л / 8 стаканов" },
  { icon: "📚", label: "Чтение · 10 страниц" },
  { icon: "🥗", label: "Без фастфуда и снеков" },
  { icon: "🚫", label: "День без алкоголя" },
];

// --- State (in-memory only) ---
let doneDays = new Set();
let doneTasks = new Set();

// --- Grid ---
const grid = document.getElementById("grid");
for (let i = 1; i <= TOTAL; i++) {
  const cell = document.createElement("div");
  cell.className = "day-cell";
  cell.dataset.day = i;
  cell.textContent = i;
  cell.addEventListener("click", () => toggleDay(i, cell));
  grid.appendChild(cell);
}

function toggleDay(day, cell) {
  if (cell.classList.contains("future")) return;
  if (doneDays.has(day)) {
    doneDays.delete(day);
    cell.classList.remove("done");
    cell.textContent = day;
  } else {
    doneDays.add(day);
    cell.classList.add("done");
    cell.textContent = "✓";
    showToast("День " + day + " отмечен! 🦥");
  }
  updateStats();
}

// --- Tasks ---
const tasksList = document.getElementById("tasks-list");
TASKS.forEach((t, i) => {
  const row = document.createElement("div");
  row.className = "task-row";
  row.dataset.idx = i;
  row.innerHTML = `
    <div class="task-check"></div>
    <div class="task-text">${t.icon} ${t.label}</div>
  `;
  row.addEventListener("click", () => toggleTask(i, row));
  tasksList.appendChild(row);
});

function toggleTask(idx, row) {
  if (doneTasks.has(idx)) {
    doneTasks.delete(idx);
    row.classList.remove("done");
  } else {
    doneTasks.add(idx);
    row.classList.add("done");
  }
  if (doneTasks.size === 5) showToast("Все задачи выполнены! 🎉");
}

// --- Stats ---
function calcStreak() {
  const sorted = [...doneDays].sort((a, b) => b - a);
  if (!sorted.length) return 0;
  let streak = 0, prev = null;
  for (const d of sorted) {
    if (prev === null || prev - d === 1) { streak++; prev = d; }
    else break;
  }
  return streak;
}

function updateStats() {
  const done = doneDays.size;
  const streak = calcStreak();
  const pct = Math.round(done / TOTAL * 100);

  document.getElementById("stat-done").textContent = done;
  document.getElementById("stat-streak").textContent = streak;
  document.getElementById("stat-pct").textContent = pct + "%";
  document.getElementById("prog-label").textContent = done + " / " + TOTAL;
  document.getElementById("prog-fill").style.width = pct + "%";
}

// --- Toast ---
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

updateStats();
</script>
</body>
</html>
